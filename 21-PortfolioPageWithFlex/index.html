<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Assets/css/style.css">
    <link rel="stylesheet" href="./Assets/css/reset.css">
   <title>Document</title>
</head>
<body>
    <!-- header start -->
     <header>
        <section id="header_area">
            <div class="container navbar">
                 <div class="logo">Start Bootstrap</div>
                 <ul class="list">
                    <li class="list_item"><a href="">Portfolio</a></li>
                    <li class="list_item"><a href="">About</a></li>
                    <li class="list_item"><a href="">Contact</a></li>
                 </ul>
            </div>
        </section>
     </header>
     <!-- header end -->

     <!-- main start -->
      <main>
        <section id="start_area">
           <div class="start">
            <div class="image"><img src="./Assets/icons/avataaars.svg" alt=""></div>
            <h1 class="start_head">Start Bootstrap</h1>
            <div class="star">
                <div class="left_line"></div>
                <i class="fa-solid fa-star fa-2xl"></i>
                <div class="right_line"></div>
            </div>
            <p class="start_text">Graphic Artist - Web Designer - Illustrator</p>
           </div>
        </section>
      </main>
      <!-- main end -->

      <!-- Portfolio section -->
       <section id="Portfolio_area">
              <div class="portfolio">
                <h2 class="title">Portfolio</h2>
                <div class="star2">
                    <div class="left_line2"></div>
                     <i class="fa-solid fa-star fa-2xl"></i>
                    <div class="right_line2"></div>
                </div>
                <div class="portfolio_photo">
                  <div class="photo1"> 
                     <div class="portfolio_item"><img src="./Assets/images/cabin.png" alt=""></div>
                    <div class="portfolio_item"><img src="./Assets/images/cake.png" alt=""></div>
                    <div class="portfolio_item"><img src="./Assets/images/circus.png" alt=""></div>
                </div>
                  <div class="photo2">  
                    <div class="portfolio_item"><img src="./Assets/images/game.png" alt=""></div>
                    <div class="portfolio_item"><img src="./Assets/images/safe.png" alt=""></div>
                    <div class="portfolio_item"><img src="./Assets/images/submarine.png" alt=""></div>
                </div>
                </div>
              </div>

       </section>


      <script src="https://kit.fontawesome.com/6748cd9d89.js" crossorigin="anonymous"></script>
</body>
</html>
